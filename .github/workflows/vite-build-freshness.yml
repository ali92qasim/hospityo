name: Vite build freshness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-build:
    name: Manifest matches a fresh Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check-build
